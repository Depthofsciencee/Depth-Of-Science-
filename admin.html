<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex"><meta name="theme-color" content="#0b6cff"><link rel="manifest" href="admin.webmanifest"><link rel="apple-touch-icon" href="admin-icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<title>Ads Admin · Depth of Science</title>
<style>
:root{color-scheme:light dark;--bg:#f4f8fb;--card:#fff;--fg:#0f2230;--mut:#5b7183;--line:#d6e1ea;--ac:#0b6cff}
@media(prefers-color-scheme:dark){:root{--bg:#07131b;--card:#0e2230;--fg:#e8f3fa;--mut:#8fa8b9;--line:#1d3647}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif;padding:16px 14px 60px}
.w{max-width:640px;margin:0 auto}h1{font-size:1.5rem;margin:6px 0 2px}h2{font-size:1.1rem;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}
label{display:block;font-size:.85rem;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
textarea{min-height:130px;resize:vertical}
button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:11px 20px;background:var(--ac);color:#fff;cursor:pointer}
button.g{background:var(--line);color:var(--fg)}button.d{background:#e11d48}button:disabled{opacity:.5}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 140px}
.msg{margin:12px 0 0;font-weight:600}.ok{color:#16a34a}.er{color:#e11d48}
.ad{display:flex;gap:12px;align-items:center;border-top:1px solid var(--line);padding:12px 0}.ad:first-of-type{border-top:0}
.ad img{width:56px;height:56px;object-fit:cover;border-radius:10px;background:var(--line);flex:none}.ad .t{flex:1;min-width:0}
.ad b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ad small{color:var(--mut)}
.pv{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.pv img{width:72px;height:72px;object-fit:cover;border-radius:10px}
a{color:var(--ac)}.hide{display:none}.brow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}.brow>:first-child{grid-column:1/-1}.brow>button{grid-column:1/-1;justify-self:start;padding:8px 18px}
</style></head><body><div class="w">
<h1>📢 Ads Admin</h1><p style="margin:8px 0"><button id="inst" class="hide">📲 Install as app</button></p><div style="color:var(--mut)">Post or delete ads. Only you can, with your token.</div>

<div class="card" id="login">
  <h2>🔑 Connect</h2>
  <label>GitHub repository (owner/name)</label><input id="repo" value="Depthofsciencee/Depth-Of-Science-">
  <label>Branch</label><input id="branch" value="main">
  <label>Access token (stays only on this phone)</label><input id="token" type="password" placeholder="github_pat_..." autocomplete="off">
  <p style="margin:12px 0 0"><button id="save">Save &amp; connect</button></p>
  <div class="msg" id="lmsg"></div>
</div>

<div id="app" class="hide">
  <div class="card">
    <h2>➕ New ad</h2>
    <div class="row"><div><label>Tag</label><input id="tag" list="tags" placeholder="Class / Notes / Seminar"><datalist id="tags"><option value="Class"><option value="Notes"><option value="Seminar"><option value="Event"><option value="Announcement"></datalist></div>
    <div><label>Medium</label><select id="med"><option value="">Any</option><option>Tamil</option><option>English</option><option>Sinhala</option><option>Tamil, English</option></select></div></div>
    <label>Title</label><input id="title">
    <label>Text</label><textarea id="text"></textarea>
    <div class="row"><div><label>WhatsApp number (optional)</label><input id="contact" inputmode="tel"></div>
    <div><label>Link (optional, https://)</label><input id="link"></div></div>
    <label>Hide automatically after (optional)</label><input id="until" type="date">
    <label>Photos (up to 4)</label><input id="photos" type="file" accept="image/*" multiple>
    <div class="pv" id="pv"></div>
    <p style="margin:14px 0 0"><button id="post">Post ad</button></p>
    <div class="msg" id="pmsg"></div>
  </div>
  <div class="card"><h2>📋 Current ads</h2><div id="list">Loading…</div><div class="msg" id="dmsg"></div></div>
  <div class="card">
    <h2>📚 Add resources</h2>
    <div class="row"><div><label>Subject</label><select id="rs"><option value="bio">Biology</option><option value="chem">Chemistry</option><option value="phy">Physics</option><option value="maths">Combined Maths</option><option value="ict">ICT</option><option value="gen">General</option></select></div>
    <div><label>Medium</label><select id="rm"><option value="EN">English</option><option value="TA">Tamil</option><option value="SI">Sinhala</option><option value="TA·EN">Tamil + English</option><option value="">Not stated</option></select></div></div>
    <label>Section title</label><input id="rg" list="grps" placeholder="e.g. Past papers, Notes, MCQs"><datalist id="grps"><option value="New resources"><option value="Past papers"><option value="Notes"><option value="Tutes &amp; books"><option value="MCQs &amp; essays"><option value="School papers"><option value="Practical"></datalist>
    <label>Resources: one per line &nbsp;&rarr;&nbsp; Name | Drive link</label>
    <textarea id="rl" placeholder="Unit 3 notes | https://drive.google.com/file/d/...&#10;2024 papers | https://drive.google.com/drive/folders/..."></textarea>
    <p style="margin:14px 0 0"><button id="radd">Add resources</button></p><div class="msg" id="rmsg"></div>
  </div>
  <div class="card"><h2>🧾 Added by admin</h2><div id="rlist">Loading…</div><div class="msg" id="rdmsg"></div></div>
  <div class="card">
    <h2>⏳ Exam countdown dates</h2>
    <div style="color:var(--mut);font-size:.9rem">Home page shows days left automatically. Leave dates empty if not announced.</div>
    <div id="bl"></div>
    <p style="margin:14px 0 0"><button class="g" id="badd">+ Add batch</button> <button id="bsave">Save dates</button></p><div class="msg" id="bmsg"></div>
  </div>
  <p><button class="g" id="logout">Disconnect this phone</button></p>
</div></div>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); }, cfg = null, files = [];
  try { cfg = JSON.parse(localStorage.getItem("dos-admin")); } catch (e) {}
  if (cfg) { $("repo").value = cfg.repo; $("branch").value = cfg.branch; }
  function say(id, t, ok) { var e = $(id); e.textContent = t; e.className = "msg " + (ok ? "ok" : "er"); }
  function hdr() { return { "Authorization": "Bearer " + cfg.token, "Accept": "application/vnd.github+json" }; }
  function url(p) { return "https://api.github.com/repos/" + cfg.repo + "/contents/" + p; }
  function b64(str) { return btoa(unescape(encodeURIComponent(str))); }
  function unb64(s) { return decodeURIComponent(escape(atob(s.replace(/\n/g, "")))); }
  async function getFile(p, wantText) {
    var r = await fetch(url(p) + "?ref=" + cfg.branch + "&t=" + Date.now(), { headers: hdr() });
    if (r.status === 404) return null;
    if (!r.ok) throw new Error(r.status === 401 || r.status === 403 ? "Token not allowed. Check the token and repo name." : "GitHub error " + r.status);
    var j = await r.json(); return { sha: j.sha, text: (wantText && j.content) ? unb64(j.content) : "" };
  }
  async function putFile(p, content64, msg, sha) {
    var body = { message: msg, content: content64, branch: cfg.branch }; if (sha) body.sha = sha;
    for (var tryNo = 0; tryNo < 2; tryNo++) {
      var r = await fetch(url(p), { method: "PUT", headers: hdr(), body: JSON.stringify(body) });
      if (r.ok) return;
      var gm = ""; try { gm = (await r.json()).message || ""; } catch (e) {}
      if (r.status === 403 && /rate limit/i.test(gm) && tryNo === 0) { await new Promise(function (ok) { setTimeout(ok, 5000); }); continue; }
      var hint = /rate limit/i.test(gm) ? " Wait 1 minute and try again." : (r.status === 403 || r.status === 404 ? " (If this keeps happening: token needs Contents = Read and write for this repository.)" : "");
      throw new Error("Could not save " + p + " (" + r.status + "): " + gm + hint);
    }
  }
  async function delFile(p) {
    var f = await getFile(p); if (!f) return;
    await fetch(url(p), { method: "DELETE", headers: hdr(), body: JSON.stringify({ message: "Delete " + p, sha: f.sha, branch: cfg.branch }) });
  }
  async function loadAds() {
    var f = await getFile("ads.json", true);
    if (f) return { sha: f.sha, ads: JSON.parse(f.text) };
    var h = await (await fetch("ads.html?t=" + Date.now())).text(), el = new DOMParser().parseFromString(h, "text/html").getElementById("ads-seed");
    return { sha: null, ads: el ? JSON.parse(el.textContent) : [] };
  }
  async function saveAds(ads, sha) { await putFile("ads.json", b64(JSON.stringify(ads, null, 1)), "Update ads", sha); }
  async function show() {
    $("login").classList.add("hide"); $("app").classList.remove("hide");
    showRes(); showBatches();
    try {
      var d = await loadAds(), box = $("list"); box.textContent = "";
      if (!d.ads.length) box.textContent = "No ads yet.";
      d.ads.forEach(function (a) {
        var row = document.createElement("div"); row.className = "ad";
        var im = document.createElement("img"), f0 = Array.isArray(a.img) ? a.img[0] : a.img; if (f0) im.src = f0; row.appendChild(im);
        var t = document.createElement("div"); t.className = "t"; var b = document.createElement("b"); b.textContent = a.title; var s = document.createElement("small");
        s.textContent = (a.tag || "Ad") + " · " + a.date + (a.until ? " · until " + a.until : ""); t.appendChild(b); t.appendChild(s); row.appendChild(t);
        var x = document.createElement("button"); x.className = "d"; x.textContent = "Delete";
        x.addEventListener("click", function () { del(a); }); row.appendChild(x); box.appendChild(row);
      });
    } catch (e) { say("dmsg", e.message, false); }
  }
  async function del(a) {
    if (!confirm("Delete this ad?\n\n" + a.title)) return;
    say("dmsg", "Deleting…", true);
    try {
      var d = await loadAds(), left = d.ads.filter(function (x) { return x.id !== a.id || (!x.id && x.title !== a.title); });
      await saveAds(left, d.sha);
      var imgs = !a.img ? [] : (Array.isArray(a.img) ? a.img : [a.img]);
      for (var i = 0; i < imgs.length; i++) { try { if (/^ad-/.test(imgs[i])) await delFile(imgs[i]); } catch (e) {} }
      say("dmsg", "Deleted. Website updates in about a minute.", true); show();
    } catch (e) { say("dmsg", e.message, false); }
  }
  function shrink(file) {
    return new Promise(function (res, rej) {
      var img = new Image(), u = URL.createObjectURL(file);
      img.onload = function () { var k = Math.min(1, 1000 / img.width), c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u); res(c.toDataURL("image/jpeg", 0.78).split(",")[1]); };
      img.onerror = function () { rej(new Error("Could not read a photo")); }; img.src = u;
    });
  }
  $("photos").addEventListener("change", function () {
    files = Array.prototype.slice.call(this.files, 0, 4); $("pv").textContent = "";
    files.forEach(function (f) { var i = document.createElement("img"); i.src = URL.createObjectURL(f); $("pv").appendChild(i); });
  });
  $("save").addEventListener("click", async function () {
    cfg = { repo: $("repo").value.trim(), branch: $("branch").value.trim() || "main", token: $("token").value.trim() || (cfg && cfg.token) || "" };
    if (!cfg.token) return say("lmsg", "Paste your token first.", false);
    say("lmsg", "Checking…", true);
    try { await getFile("ads.html"); localStorage.setItem("dos-admin", JSON.stringify(cfg)); show(); } catch (e) { say("lmsg", e.message, false); }
  });
  $("logout").addEventListener("click", function () { localStorage.removeItem("dos-admin"); location.reload(); });
  $("post").addEventListener("click", async function () {
    var title = $("title").value.trim(); if (!title) return say("pmsg", "Title is required.", false);
    var btn = this; btn.disabled = true; say("pmsg", "Posting… please wait", true);
    try {
      var names = [], stamp = Date.now();
      for (var i = 0; i < files.length; i++) { var n = "ad-" + stamp + "-" + (i + 1) + ".jpg"; await putFile(n, await shrink(files[i]), "Add " + n); names.push(n); }
      var d = await loadAds(), now = new Date(), pad = function (n) { return String(n).padStart(2, "0"); };
      var ad = { id: "ad-" + stamp, date: now.getFullYear() + "-" + pad(now.getMonth() + 1) + "-" + pad(now.getDate()), tag: $("tag").value.trim() || "Ad", title: title, text: $("text").value.trim(), contact: $("contact").value.trim(), med: $("med").value };
      if ($("link").value.trim()) ad.link = $("link").value.trim(); if ($("until").value) ad.until = $("until").value; if (names.length) ad.img = names.length === 1 ? names[0] : names;
      d.ads.unshift(ad); await saveAds(d.ads, d.sha);
      say("pmsg", "✅ Posted! It will show on the website in about a minute.", true);
      ["title", "text", "contact", "link", "until", "tag"].forEach(function (k) { $(k).value = ""; }); $("photos").value = ""; $("pv").textContent = ""; files = []; show();
    } catch (e) { say("pmsg", e.message, false); }
    btn.disabled = false;
  });

  async function readJson(p, fb) { var f = await getFile(p, true); return f ? { sha: f.sha, data: JSON.parse(f.text) } : { sha: null, data: fb }; }
  async function writeJson(p, data, sha, msg) { await putFile(p, b64(JSON.stringify(data, null, 1)), msg, sha); }
  var SUBJ = { bio: "Biology", chem: "Chemistry", phy: "Physics", maths: "Maths", ict: "ICT", gen: "General" };
  async function showRes() {
    try {
      var d = await readJson("resources.json", []), box = $("rlist"); box.textContent = "";
      if (!d.data.length) box.textContent = "Nothing added yet.";
      d.data.slice(0, 40).forEach(function (r) {
        var row = document.createElement("div"); row.className = "ad";
        var t = document.createElement("div"); t.className = "t"; var b = document.createElement("b"); b.textContent = r.n; var sm = document.createElement("small"); sm.textContent = (SUBJ[r.s] || r.s) + " \u00b7 " + r.g + (r.m ? " \u00b7 " + r.m : ""); t.appendChild(b); t.appendChild(sm); row.appendChild(t);
        var x = document.createElement("button"); x.className = "d"; x.textContent = "Delete"; x.addEventListener("click", function () { delRes(r); }); row.appendChild(x); box.appendChild(row);
      });
    } catch (e) { say("rdmsg", e.message, false); }
  }
  async function delRes(r) {
    if (!confirm("Delete this resource?\n\n" + r.n)) return; say("rdmsg", "Deleting\u2026", true);
    try { var d = await readJson("resources.json", []); await writeJson("resources.json", d.data.filter(function (x) { return x.id !== r.id; }), d.sha, "Remove resource"); say("rdmsg", "Deleted. Website updates in about a minute.", true); showRes(); } catch (e) { say("rdmsg", e.message, false); }
  }
  $("radd").addEventListener("click", async function () {
    var lines = $("rl").value.split("\n").map(function (x) { return x.trim(); }).filter(Boolean), g = $("rg").value.trim() || "New resources";
    if (!lines.length) return say("rmsg", "Add at least one line.", false);
    var btn = this; btn.disabled = true; say("rmsg", "Adding\u2026", true);
    try {
      var d = await readJson("resources.json", []), have = {}, added = 0, skipped = 0, stamp = Date.now();
      d.data.forEach(function (x) { have[x.u] = 1; });
      lines.forEach(function (ln, i) {
        var m = ln.match(/https?:\/\/\S+/); if (!m) { skipped++; return; }
        var u = m[0], name = ln.replace(u, "").replace(/[|\u2013\u2014\-:]+\s*$/, "").replace(/^[|\s]+|[|\s]+$/g, "").trim() || "Resource";
        if (have[u]) { skipped++; return; } have[u] = 1; added++;
        d.data.unshift({ id: "r-" + stamp + "-" + i, s: $("rs").value, g: g, n: name, m: $("rm").value, k: /\/folders\//.test(u) ? "d" : "f", u: u, date: new Date().toISOString().slice(0, 10) });
      });
      if (added) await writeJson("resources.json", d.data, d.sha, "Add resources");
      say("rmsg", "\u2705 Added " + added + (skipped ? " (skipped " + skipped + " duplicate/invalid)" : "") + ". Website updates in about a minute.", true);
      if (added) { $("rl").value = ""; showRes(); }
    } catch (e) { say("rmsg", e.message, false); }
    btn.disabled = false;
  });
  var DEFB = [{ name: "2027 A/L", start: "2027-08-03", end: "2027-08-28" }, { name: "2028 A/L", start: "", end: "" }, { name: "2029 A/L", start: "", end: "" }], bsha = null;
  function brow(b) {
    var r = document.createElement("div"); r.className = "brow";
    function f(lab, type, val, k) { var w = document.createElement("div"), l = document.createElement("label"), i = document.createElement("input"); l.textContent = lab; i.type = type; i.value = val || ""; i.setAttribute("data-k", k); w.appendChild(l); w.appendChild(i); return w; }
    r.appendChild(f("Batch", "text", b.name, "name")); r.appendChild(f("First paper", "date", b.start, "start")); r.appendChild(f("Last paper", "date", b.end, "end"));
    var x = document.createElement("button"); x.className = "d"; x.textContent = "Remove"; x.addEventListener("click", function () { r.remove(); }); r.appendChild(x); $("bl").appendChild(r);
  }
  async function showBatches() { try { var d = await readJson("batches.json", DEFB); bsha = d.sha; $("bl").textContent = ""; d.data.forEach(brow); } catch (e) { say("bmsg", e.message, false); } }
  $("badd").addEventListener("click", function () { brow({ name: "", start: "", end: "" }); });
  $("bsave").addEventListener("click", async function () {
    var out = Array.prototype.map.call($("bl").children, function (r) { var o = {}; Array.prototype.forEach.call(r.querySelectorAll("input"), function (i) { o[i.getAttribute("data-k")] = i.value.trim(); }); return o; }).filter(function (o) { return o.name; });
    say("bmsg", "Saving\u2026", true);
    try { var cur = await readJson("batches.json", DEFB); await writeJson("batches.json", out, cur.sha, "Update exam dates"); say("bmsg", "\u2705 Saved. Home page updates in about a minute.", true); } catch (e) { say("bmsg", e.message, false); }
  });
  var dip = null;
  window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); dip = e; $("inst").classList.remove("hide"); });
  $("inst").addEventListener("click", function () { if (dip) { dip.prompt(); dip = null; $("inst").classList.add("hide"); } });
  window.addEventListener("appinstalled", function () { $("inst").classList.add("hide"); });
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("admin-sw.js", { scope: "./" }).catch(function () {});
  if (cfg && cfg.token) show();
})();
</script></body></html>
